# Publishes site/ (the in-browser Spanish demo) to GitHub Pages.
# site/ is static and committed as it is served: the eSpeak NG WebAssembly
# build in site/espeak/ is made by scripts/build_espeak_wasm.sh, and the model
# is fetched by the page from Hugging Face. Enable Pages with "GitHub Actions"
# as the source in the repository settings.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
